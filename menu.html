<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Menu UI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .header {
      text-align: center;
      padding: 20px;
      background-color: #333;
      color: white;
    }

    .menu-bar {
      display: flex;
      justify-content: center;
      background-color: #444;
      padding: 10px;
    }

    .menu {
      margin: 0 30px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      display: flex;
      justify-content: center;
      margin-top: 40px;
      gap: 50px;
    }

    .box {
      background: white;
      padding: 20px;
      width: 150px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .box h3 {
      text-align: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .box ul {
      list-style: none;
      padding: 0;
    }

    .box ul li {
      padding: 8px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    .box ul li:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Meaningful Editor UI</h1>
  </div>

  <div class="menu-bar">
    <div class="menu">File</div>
    <div class="menu">Edit</div>
    <div class="menu">Format</div>
  </div>

  <div class="container">

    <div class="box">
      <h3>File</h3>
      <ul>
        <li>New</li>
        <li>Open</li>
        <li>Save</li>
        <li>Save As</li>
        <li>Print</li>
      </ul>
    </div>

    <div class="box">
      <h3>Edit</h3>
      <ul>
        <li>Cut</li>
        <li>Copy</li>
        <li>Paste</li>
      </ul>
    </div>

    <div class="box">
      <h3>Format</h3>
      <ul>
        <li>Bold</li>
        <li>Italic</li>
        <li>Underline</li>
      </ul>
    </div>

  </div>

</body>
</html>
